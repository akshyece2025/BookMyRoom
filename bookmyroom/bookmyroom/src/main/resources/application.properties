spring.application.name=bookmyroom
server.port=8080

# ---------- Database: MySQL ----------
# If MySQL is not running or the login fails, config/DatabaseConfig.java
# automatically switches to the built-in H2 database, so the app still starts.
spring.datasource.url=jdbc:mysql://localhost:3306/bookmyroom?createDatabaseIfNotExist=true&connectTimeout=5000
spring.datasource.username=root
spring.datasource.password=251900


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
app.seed-data=true

# Show validation messages in logs only, never stack traces to the client
spring.web.error.include-stacktrace=never
