# Run with MySQL:  mvnw spring-boot:run -Dspring-boot.run.profiles=mysql
# 1. Create the database first:  CREATE DATABASE bookmyroom;
# 2. Change the username/password below to your MySQL login.
spring.datasource.url=jdbc:mysql://localhost:3306/bookmyroom?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=251900
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# keep tables & data between restarts
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
