
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BookMyRoom - Guest House Booking</title>
  <style>
    :root {
      --bg: #f4f6f9;
      --card: #fff;
      --ink: #1f2933;
      --muted: #616e7c;
      --line: #d9e2ec;
      --brand: #1f6f8b;
      --brand2: #164e63;
      --ok: #1b7f4b;
      --bad: #b42318;
      --warn: #b54708;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: 'Segoe UI', Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
    }
    header {
      background: var(--brand2);
      color: #fff;
      padding: 14px 20px;
    }
    header h1 {
      margin: 0;
      font-size: 20px;
    }
    header p {
      margin: 2px 0 0;
      font-size: 13px;
      opacity: 0.85;
    }
    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      background: var(--brand);
      padding: 6px 12px;
    }
    nav button {
      background: transparent;
      border: 0;
      color: #fff;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }
    nav button.active,
    nav button:hover {
      background: rgba(255, 255, 255, 0.18);
    }
    main {
      max-width: 1100px;
      margin: 18px auto;
      padding: 0 16px;
    }
    section {
      display: none;
    }
    section.active {
      display: block;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .card h2 {
      margin: 0 0 12px;
      font-size: 17px;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 12px;
    }
    .stat {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 14px;
    }
    .stat .v {
      font-size: 26px;
      font-weight: 600;
      color: var(--brand2);
    }
    .stat .l {
      font-size: 13px;
      color: var(--muted);
    }
    form.grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 10px;
      align-items: end;
    }
    label {
      font-size: 12px;
      color: var(--muted);
      display: block;
      margin-bottom: 3px;
    }
    input,
    select {
      width: 100%;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 6px;
      font-size: 14px;
    }
    button.primary {
      background: var(--brand);
      color: #fff;
      border: 0;
      padding: 9px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }
    button.primary:hover {
      background: var(--brand2);
    }
    button.small {
      padding: 4px 10px;
      font-size: 12px;
      border-radius: 5px;
      border: 1px solid var(--line);
      background: #fff;
      cursor: pointer;
    }
    button.danger {
      color: var(--bad);
      border-color: #f4c7c3;
    }
    .table-wrap {
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    th,
    td {
      text-align: left;
      padding: 8px;
      border-bottom: 1px solid var(--line);
      white-space: nowrap;
    }
    th {
      background: #f0f4f8;
      font-weight: 600;
      font-size: 13px;
    }
    td.num,
    th.num {
      text-align: right;
    }
    .badge {
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
    }
    .CONFIRMED {
      background: #dcfae6;
      color: var(--ok);
    }
    .CANCELLED {
      background: #fee4e2;
      color: var(--bad);
    }
    .msg {
      padding: 10px 12px;
      border-radius: 6px;
      margin-top: 10px;
      font-size: 14px;
      display: none;
      white-space: pre-line;
    }
    .msg.ok {
      display: block;
      background: #dcfae6;
      color: var(--ok);
    }
    .msg.err {
      display: block;
      background: #fee4e2;
      color: var(--bad);
    }
    .bar {
      height: 8px;
      background: #e4e7eb;
      border-radius: 4px;
      min-width: 90px;
    }
    .bar > div {
      height: 8px;
      background: var(--brand);
      border-radius: 4px;
    }
    .muted {
      color: var(--muted);
      font-size: 13px;
    }
  </style>
</head>
<body>
<header>
  <h1>BookMyRoom</h1>
  <p>Guest House Room Booking System - staff console</p>
</header>
<nav>
  <button data-tab="dashboard" class="active">Dashboard</button>
  <button data-tab="rooms">Rooms</button>
  <button data-tab="book">Check Availability &amp; Book</button>
  <button data-tab="bookings">Bookings</button>
  <button data-tab="report">Occupancy Report</button>
</nav>
<main>
  <!-- DASHBOARD -->
  <section id="dashboard" class="active">
    <div class="stats" id="stats"></div>
    <p class="muted">
      Tip: every screen here calls the same REST API you test in Postman (see README).
    </p>
  </section>

  <!-- ROOMS -->
  <section id="rooms">
    <div class="card">
      <h2>Add a room</h2>
      <form class="grid" id="roomForm">
        <div>
          <label>Room number</label>
          <input name="roomNumber" required placeholder="e.g. 105" />
        </div>
        <div>
          <label>Type</label>
          <select name="type">
            <option>SINGLE</option>
            <option>DOUBLE</option>
            <option>DELUXE</option>
            <option>SUITE</option>
            <option>DORMITORY</option>
          </select>
        </div>
        <div>
          <label>Capacity</label>
          <input name="capacity" type="number" min="1" value="2" required />
        </div>
        <div>
          <label>Rate per night (Rs)</label>
          <input name="ratePerNight" type="number" min="1" step="0.01" value="1500" required />
        </div>
        <div><button class="primary" type="submit">Add room</button></div>
      </form>
      <div class="msg" id="roomMsg"></div>
    </div>
    <div class="card">
      <h2>All rooms</h2>
      <form class="grid" id="roomFilter">
        <div>
          <label>Type</label>
          <select name="type">
            <option value="">Any</option>
            <option>SINGLE</option>
            <option>DOUBLE</option>
            <option>DELUXE</option>
            <option>SUITE</option>
            <option>DORMITORY</option>
          </select>
        </div>
        <div>
          <label>Min capacity</label>
          <input name="minCapacity" type="number" min="1" />
        </div>
        <div>
          <label>Max rate</label>
          <input name="maxRate" type="number" min="1" />
        </div>
        <div><button class="primary" type="submit">Filter</button></div>
      </form>
      <div class="table-wrap"><table id="roomTable"></table></div>
      <div class="msg" id="roomListMsg"></div>
    </div>
  </section>

  <!-- AVAILABILITY + BOOK -->
  <section id="book">
    <div class="card">
      <h2>1. Check availability</h2>
      <form class="grid" id="availForm">
        <div>
          <label>Check-in</label>
          <input name="checkIn" type="date" required />
        </div>
        <div>
          <label>Check-out</label>
          <input name="checkOut" type="date" required />
        </div>
        <div>
          <label>Guests</label>
          <input name="guests" type="number" min="1" value="1" required />
        </div>
        <div><button class="primary" type="submit">Search free rooms</button></div>
      </form>
      <div class="msg" id="availMsg"></div>
      <div class="table-wrap"><table id="availTable"></table></div>
    </div>
    <div class="card">
      <h2>2. Confirm booking</h2>
      <form class="grid" id="bookForm">
        <div>
          <label>Room id</label>
          <input
                  name="roomId"
                  type="number"
                  min="1"
                  required
                  placeholder="pick from list above"
          />
        </div>
        <div>
          <label>Guest name</label>
          <input name="guestName" required />
        </div>
        <div>
          <label>Guest e-mail</label>
          <input name="guestEmail" type="email" required />
        </div>
        <div>
          <label>Phone (optional)</label>
          <input name="guestPhone" />
        </div>
        <div>
          <label>Check-in</label>
          <input name="checkInDate" type="date" required />
        </div>
        <div>
          <label>Check-out</label>
          <input name="checkOutDate" type="date" required />
        </div>
        <div>
          <label>Guests</label>
          <input name="numberOfGuests" type="number" min="1" value="1" required />
        </div>
        <div><button class="primary" type="submit">Confirm booking</button></div>
      </form>
      <div class="msg" id="bookMsg"></div>
    </div>
  </section>

  <!-- BOOKINGS -->
  <section id="bookings">
    <div class="card">
      <h2>Bookings</h2>
      <form class="grid" id="bookingFilter">
        <div>
          <label>Status</label>
          <select name="status">
            <option value="">Any</option>
            <option>CONFIRMED</option>
            <option>CANCELLED</option>
          </select>
        </div>
        <div>
          <label>Guest e-mail contains</label>
          <input name="guestEmail" />
        </div>
        <div>
          <label>Stay from</label>
          <input name="from" type="date" />
        </div>
        <div>
          <label>Stay to</label>
          <input name="to" type="date" />
        </div>
        <div><button class="primary" type="submit">Search</button></div>
      </form>
      <div class="msg" id="bookingMsg"></div>
      <div class="table-wrap"><table id="bookingTable"></table></div>
    </div>
  </section>

  <!-- REPORT -->
  <section id="report">
    <div class="card">
      <h2>Monthly occupancy report</h2>
      <form class="grid" id="reportForm">
        <div>
          <label>Month</label>
          <input name="month" type="month" required />
        </div>
        <div><button class="primary" type="submit">Show report</button></div>
      </form>
      <div class="msg" id="reportMsg"></div>
      <div id="reportSummary" class="stats" style="margin-top: 12px"></div>
      <div class="table-wrap" style="margin-top: 12px"><table id="reportTable"></table></div>
    </div>
  </section>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  const money = (v) =>
          'Rs ' +
          Number(v).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const esc = (s) =>
          String(s ?? '').replace(
                  /[&<>"']/g,
                  (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c],
          );
  const today = () =>
          new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);
  const addDays = (iso, n) => {
    const d = new Date(iso + 'T00:00:00');
    d.setDate(d.getDate() + n);
    return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
  };

  // Always talk to the Spring Boot app on port 8080, even when this page is opened
  // from IntelliJ's preview server (port 63342) or directly as a file.
  const API_BASE =
          location.protocol.startsWith('http') && location.port === '8080'
                  ? ''
                  : 'http://localhost:8080';

  async function api(method, url, body) {
    const opts = { method, headers: {} };
    if (body !== undefined) {
      opts.headers['Content-Type'] = 'application/json';
      opts.body = JSON.stringify(body);
    }
    let res;
    try {
      res = await fetch(API_BASE + url, opts);
    } catch (e) {
      throw new Error(
              'Cannot reach the BookMyRoom server at http://localhost:8080 - start BookMyRoomApplication in IntelliJ first.',
      );
    }
    const text = await res.text();
    let data = null;
    try {
      data = text ? JSON.parse(text) : null;
    } catch (e) {
      throw new Error(
              'The server did not return JSON. Open the app at http://localhost:8080 while BookMyRoomApplication is running.',
      );
    }
    if (!res.ok) {
      let msg = (data && data.message) || 'HTTP ' + res.status;
      if (data && data.fieldErrors)
        msg +=
                '\n' +
                Object.entries(data.fieldErrors)
                        .map(([f, m]) => '- ' + f + ': ' + m)
                        .join('\n');
      throw new Error(res.status + ' ' + (data ? data.error : '') + ': ' + msg);
    }
    return data;
  }
  function show(id, ok, text) {
    const el = $(id);
    el.className = 'msg ' + (ok ? 'ok' : 'err');
    el.textContent = text;
  }
  function clear(id) {
    const el = $(id);
    el.className = 'msg';
    el.textContent = '';
  }
  function formData(form) {
    return Object.fromEntries(new FormData(form).entries());
  }
  function query(obj) {
    const p = new URLSearchParams();
    Object.entries(obj).forEach(([k, v]) => {
      if (v !== '' && v != null) p.append(k, v);
    });
    return p.toString();
  }

  // ---------- tabs ----------
  document.querySelectorAll('nav button').forEach((b) =>
          b.addEventListener('click', () => {
            document
                    .querySelectorAll('nav button')
                    .forEach((x) => x.classList.toggle('active', x === b));
            document
                    .querySelectorAll('section')
                    .forEach((s) => s.classList.toggle('active', s.id === b.dataset.tab));
            ({ dashboard: loadDashboard, rooms: loadRooms, bookings: loadBookings })[
                    b.dataset.tab
                    ]?.();
          }),
  );

  // ---------- dashboard ----------
  async function loadDashboard() {
    try {
      const d = await api('GET', '/api/dashboard');
      const items = [
        ['Total rooms', d.totalRooms],
        ['Occupied today', d.roomsOccupiedToday],
        ['Free today', d.roomsAvailableToday],
        ['Check-ins next 7 days', d.checkInsNext7Days],
        ['Guests', d.totalGuests],
        ['Confirmed bookings', d.confirmedBookings],
        ['Cancelled bookings', d.cancelledBookings],
        ['Confirmed revenue', money(d.confirmedRevenue)],
      ];
      $('stats').innerHTML = items
              .map(
                      ([l, v]) =>
                              `<div class="stat"><div class="v">${esc(v)}</div><div class="l">${l}</div></div>`,
              )
              .join('');
    } catch (e) {
      $('stats').innerHTML = `<div class="msg err">${esc(e.message)}</div>`;
    }
  }

  // ---------- rooms ----------
  async function loadRooms(filters = {}) {
    clear('roomListMsg');
    try {
      const rooms = await api('GET', '/api/rooms?' + query(filters));
      $('roomTable').innerHTML =
              '<tr><th>Id</th><th>Room</th><th>Type</th><th class="num">Capacity</th><th class="num">Rate / night</th><th></th></tr>' +
              (rooms.length
                      ? rooms
                              .map(
                                      (
                                              r,
                                      ) => `<tr><td>${r.id}</td><td>${esc(r.roomNumber)}</td><td>${r.type}</td><td class="num">${r.capacity}</td>
        <td class="num">${money(r.ratePerNight)}</td><td><button class="small danger" data-del="${r.id}">Delete</button></td></tr>`,
                              )
                              .join('')
                      : '<tr><td colspan="6" class="muted">No rooms found</td></tr>');
    } catch (e) {
      show('roomListMsg', false, e.message);
    }
  }
  $('roomTable').addEventListener('click', async (ev) => {
    const id = ev.target.dataset.del;
    if (!id) return;
    if (!confirm('Delete room id ' + id + '?')) return;
    try {
      await api('DELETE', '/api/rooms/' + id);
      show('roomListMsg', true, 'Room deleted');
      loadRooms();
    } catch (e) {
      show('roomListMsg', false, e.message);
    }
  });
  $('roomForm').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const f = formData(ev.target);
    try {
      const r = await api('POST', '/api/rooms', {
        roomNumber: f.roomNumber,
        type: f.type,
        capacity: Number(f.capacity),
        ratePerNight: Number(f.ratePerNight),
      });
      show('roomMsg', true, `Room ${r.roomNumber} added with id ${r.id}`);
      ev.target.reset();
      loadRooms();
    } catch (e) {
      show('roomMsg', false, e.message);
    }
  });
  $('roomFilter').addEventListener('submit', (ev) => {
    ev.preventDefault();
    loadRooms(formData(ev.target));
  });

  // ---------- availability & booking ----------
  $('availForm').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    clear('availMsg');
    const f = formData(ev.target);
    try {
      const a = await api('GET', '/api/rooms/available?' + query(f));
      show(
              'availMsg',
              true,
              `${a.availableCount} room(s) free for ${a.nights} night(s), ${a.checkInDate} to ${a.checkOutDate}`,
      );
      $('availTable').innerHTML =
              '<tr><th>Id</th><th>Room</th><th>Type</th><th class="num">Capacity</th><th class="num">Rate / night</th><th class="num">Total</th><th></th></tr>' +
              a.rooms
                      .map(
                              (
                                      r,
                              ) => `<tr><td>${r.id}</td><td>${esc(r.roomNumber)}</td><td>${r.type}</td><td class="num">${r.capacity}</td>
        <td class="num">${money(r.ratePerNight)}</td><td class="num">${money(r.estimatedTotalCost)}</td>
        <td><button class="small" data-pick="${r.id}">Select</button></td></tr>`,
                      )
                      .join('');
      const bf = $('bookForm');
      bf.checkInDate.value = f.checkIn;
      bf.checkOutDate.value = f.checkOut;
      bf.numberOfGuests.value = f.guests;
    } catch (e) {
      $('availTable').innerHTML = '';
      show('availMsg', false, e.message);
    }
  });
  $('availTable').addEventListener('click', (ev) => {
    const id = ev.target.dataset.pick;
    if (!id) return;
    $('bookForm').roomId.value = id;
    $('bookForm').guestName.focus();
  });
  $('bookForm').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const f = formData(ev.target);
    const body = {
      roomId: Number(f.roomId),
      guestName: f.guestName,
      guestEmail: f.guestEmail,
      guestPhone: f.guestPhone.trim() === '' ? null : f.guestPhone.trim(),
      checkInDate: f.checkInDate,
      checkOutDate: f.checkOutDate,
      numberOfGuests: Number(f.numberOfGuests),
    };
    try {
      const b = await api('POST', '/api/bookings', body);
      show(
              'bookMsg',
              true,
              `Booking #${b.id} confirmed: room ${b.roomNumber}, ${b.nights} night(s) x ${money(b.ratePerNight)} = ${money(b.totalCost)}`,
      );
    } catch (e) {
      show('bookMsg', false, e.message);
    }
  });

  // ---------- bookings ----------
  async function loadBookings(filters = {}) {
    clear('bookingMsg');
    try {
      const list = await api('GET', '/api/bookings?' + query(filters));
      $('bookingTable').innerHTML =
              '<tr><th>#</th><th>Room</th><th>Guest</th><th>Check-in</th><th>Check-out</th><th class="num">Nights</th><th class="num">Total</th><th>Status</th><th></th></tr>' +
              (list.length
                      ? list
                              .map(
                                      (
                                              b,
                                      ) => `<tr><td>${b.id}</td><td>${esc(b.roomNumber)}</td><td>${esc(b.guestName)}<br><span class="muted">${esc(b.guestEmail)}</span></td>
        <td>${b.checkInDate}</td><td>${b.checkOutDate}</td><td class="num">${b.nights}</td><td class="num">${money(b.totalCost)}</td>
        <td><span class="badge ${b.status}">${b.status}</span></td>
        <td>${b.status === 'CONFIRMED' ? `<button class="small danger" data-cancel="${b.id}">Cancel</button>` : ''}</td></tr>`,
                              )
                              .join('')
                      : '<tr><td colspan="9" class="muted">No bookings found</td></tr>');
    } catch (e) {
      show('bookingMsg', false, e.message);
    }
  }
  $('bookingTable').addEventListener('click', async (ev) => {
    const id = ev.target.dataset.cancel;
    if (!id) return;
    if (!confirm('Cancel booking #' + id + '?')) return;
    try {
      const b = await api('DELETE', '/api/bookings/' + id);
      await loadBookings(formData($('bookingFilter')));
      show(
              'bookingMsg',
              true,
              `Booking #${b.id} cancelled - room ${b.roomNumber} is free again`,
      );
    } catch (e) {
      show('bookingMsg', false, e.message);
    }
  });
  $('bookingFilter').addEventListener('submit', (ev) => {
    ev.preventDefault();
    loadBookings(formData(ev.target));
  });

  // ---------- report ----------
  $('reportForm').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    clear('reportMsg');
    try {
      const r = await api('GET', '/api/reports/occupancy?' + query(formData(ev.target)));
      const items = [
        ['Occupancy', r.occupancyPercent + '%'],
        ['Booked room-nights', r.bookedRoomNights + ' / ' + r.totalRoomNights],
        ['Bookings in month', r.bookingsInMonth],
        ['Revenue', money(r.totalRevenue)],
      ];
      $('reportSummary').innerHTML = items
              .map(
                      ([l, v]) =>
                              `<div class="stat"><div class="v">${esc(v)}</div><div class="l">${l}</div></div>`,
              )
              .join('');
      $('reportTable').innerHTML =
              '<tr><th>Room</th><th>Type</th><th class="num">Nights booked</th><th>Occupancy</th><th class="num">Revenue</th></tr>' +
              r.rooms
                      .map(
                              (
                                      x,
                              ) => `<tr><td>${esc(x.roomNumber)}</td><td>${x.type}</td><td class="num">${x.bookedNights} / ${r.daysInMonth}</td>
        <td><div class="bar"><div style="width:${Math.min(100, Number(x.occupancyPercent))}%"></div></div><span class="muted">${x.occupancyPercent}%</span></td>
        <td class="num">${money(x.revenue)}</td></tr>`,
                      )
                      .join('');
    } catch (e) {
      show('reportMsg', false, e.message);
    }
  });

  // ---------- defaults ----------
  const t = today();
  $('availForm').checkIn.value = t;
  $('availForm').checkOut.value = addDays(t, 2);
  $('reportForm').month.value = t.slice(0, 7);
  loadDashboard();
</script>
</body>
</html>
